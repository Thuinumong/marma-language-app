<style>
:root{--bg:#F6EEDC;--sf:#FFFBF2;--tx:#1d2b2a;--mu:#6b7774;--pr:#0F5C5A;--pt:#fff;--ac:#F2B53B;--rd:#B3261E;--bd:#e4d9bf;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a19;--sf:#152826;--tx:#eef3f1;--mu:#9fb1ad;--pr:#2aa39d;--pt:#06201f;--bd:#27403d;--rd:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1a19;--sf:#152826;--tx:#eef3f1;--mu:#9fb1ad;--pr:#2aa39d;--pt:#06201f;--bd:#27403d;--rd:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri','Noto Sans Myanmar','Noto Sans Bengali',system-ui,sans-serif;line-height:1.5}
#app{max-width:560px;margin:0 auto;min-height:100vh}#app.wide{max-width:1000px;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;align-items:center}.hero .cta{margin-top:auto;width:100%;padding-top:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 14px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:1.15rem;margin-bottom:8px}.sp{flex:1}
.search,.in{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit}
.in{margin:6px 0;border-radius:12px}.search:focus,.in:focus{outline:2px solid var(--pr)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab,.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}

.top{display:flex;justify-content:space-between;gap:8px}.acts{display:flex;align-items:flex-start}
.mm{font-size:1.25rem;font-weight:600;color:var(--pr)}.pr{color:var(--rd);font-size:.95rem}
.bn{margin-top:4px;font-size:1.05rem}.en{color:var(--mu);font-size:.95rem}
.star{background:none;border:0;font-size:1.5rem;color:var(--ac);cursor:pointer;padding:0 4px}

td .in,th .in{min-width:120px;margin:0}.x{border:0;background:none;color:var(--rd);cursor:pointer;font-size:1rem}

.auth{max-width:420px;width:100%;margin:0 auto;padding:40px 24px;text-align:center}#app.auth-pg{display:flex;flex-direction:column;min-height:100vh}.auth-pg .auth{flex:1;display:flex;flex-direction:column;justify-content:center}.auth svg{align-self:center}.auth h1{color:var(--pr)}
.snav{display:flex;align-items:center;gap:10px;padding:14px 18px}

textarea.in{min-height:90px}.pbody{white-space:pre-wrap;margin:8px 0}.badge{font-size:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:1px 8px;color:var(--mu);height:fit-content}
.cmt{border-top:1px dashed var(--bd);padding:6px 0;font-size:.95rem}.stars button{background:none;border:0;font-size:2rem;color:var(--ac);cursor:pointer}
.sbtn{flex:0 0 auto;align-self:center;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;color:var(--pr);cursor:pointer;padding:0;margin-right:2px}.sbtn[data-st=syncOff]{color:#8a8f8e}.sbtn[data-st=syncAuth]{color:#c77700}.sbtn[data-st=syncWork] svg{animation:sspin 1.1s linear infinite}@keyframes sspin{to{transform:rotate(360deg)}}
.mbtn{flex:0 0 auto;align-self:center;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;padding:0}.mbtn.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.back svg{vertical-align:-3px}.menu h2 svg{display:block}
.legal h3{text-transform:none;letter-spacing:0;color:var(--pr);font-size:1rem;margin:14px 0 2px}.legal h3:first-child{margin-top:0}.legal p{margin:2px 0}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
// ---- Password hashing (salted SHA-256), phone/email helpers ----
const sha256=(()=>{const K=[],H0=[];for(let n=2,c=0;c<64;n++){let p=1;for(let i=2;i*i<=n;i++)if(n%i==0){p=0;break}if(p){if(c<8)H0[c]=Math.floor(Math.pow(n,.5)%1*4294967296);K[c]=Math.floor(Math.pow(n,1/3)%1*4294967296);c++}}
const R=(x,n)=>(x>>>n)|(x<<(32-n));
return s=>{const b=unescape(encodeURIComponent(s)),l=b.length,w=[];for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);w[l>>2]|=128<<(24-(l%4)*8);const N=(((l+8)>>6)+1)*16;for(let i=0;i<N;i++)w[i]|=0;w[N-1]=l*8;
const H=H0.slice();for(let j=0;j<N;j+=16){const x=w.slice(j,j+16);for(let i=16;i<64;i++){const a=x[i-15],c=x[i-2];x[i]=(x[i-16]+(R(a,7)^R(a,18)^(a>>>3))+x[i-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}
let[a,b2,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+x[i],t2=(R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c));h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
[a,b2,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0)}
return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}})();
const hpw=(p,sl=Math.random().toString(36).slice(2,10)+Date.now().toString(36))=>'h2:'+sl+':'+sha256(sl+p);
const pwOk=(u,p)=>{if(!u.pass)return false;if(u.pass.startsWith('h2:')){const a=u.pass.split(':');return sha256(a[1]+p)===a[2]}return u.pass===btoa(unescape(encodeURIComponent(p)))};
const normPhone=x=>{x=String(x||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[\s\-().]/g,'');const m=x.match(/^\+?880(1\d{9})$/);return m?'0'+m[1]:x};
const okPhone=x=>/^\+?\d{7,15}$/.test(x),okMail=x=>/\S+@\S+\.\S+/.test(x);
const parseId=x=>{x=String(x||'').trim();if(!x)return null;if(x.includes('@')){x=x.toLowerCase();return okMail(x)?{email:x,phone:'',key:x}:null}const p=normPhone(x);return okPhone(p)?{email:'',phone:p,key:p}:null};
const findUser=i=>USERS.find(u=>i.email?u.email===i.email:u.phone===i.phone);
const contact=u=>[u.email,u.phone].filter(Boolean).join(' · ');
const burger=n=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`;
// ---- Privacy policy text: [title EN, title BN, text EN, text BN] ----
const CONTACT_EMAIL=''; // put your support email here, e.g. 'you@example.com' - it appears at the end of the policy
const PRIV=[
['Overview','সারসংক্ষেপ','Marma Language is a free app to learn and preserve the Marma language. This policy explains what information the app uses and how it is handled. Last updated: 10 October 2026.','Marma Language মারমা ভাষা শেখা ও সংরক্ষণের একটি বিনামূল্যের অ্যাপ। এই নীতিতে বলা হয়েছে অ্যাপ কোন তথ্য ব্যবহার করে এবং কীভাবে সামলায়। সর্বশেষ আপডেট: ১০ অক্টোবর ২০২৬।'],
['Information you give us','আপনি যে তথ্য দেন','Your name, email address and/or phone number, a password, an optional profile photo, your favourites and ratings, and any stories, poems or comments you write. Admins may also add words, tables and audio clips.','আপনার নাম, ইমেইল ও/বা ফোন নম্বর, পাসওয়ার্ড, ঐচ্ছিক প্রোফাইল ছবি, ফেভারিট ও রেটিং, এবং আপনার লেখা গল্প, কবিতা ও মন্তব্য। অ্যাডমিনরা শব্দ, টেবিল ও অডিও ক্লিপও যোগ করতে পারেন।'],
['Where your data is stored','তথ্য কোথায় থাকে','Your account and the shared content (words, tables, stories, comments, ratings) are stored in our online database (Supabase) so they can sync between your devices and with other users. A copy is also kept on your device so the app works without internet. Passwords are handled by the login service and are never stored as plain text. Clearing the app data removes only the copy on your device. The app also loads its fonts from Google Fonts.','আপনার অ্যাকাউন্ট ও শেয়ার করা কনটেন্ট (শব্দ, টেবিল, গল্প, মন্তব্য, রেটিং) আমাদের অনলাইন ডাটাবেসে (Supabase) থাকে, যাতে আপনার সব ডিভাইসে ও অন্য ইউজারদের সাথে সিঙ্ক হয়। ইন্টারনেট ছাড়া চালানোর জন্য একটি কপি আপনার ডিভাইসেও থাকে। পাসওয়ার্ড লগইন সার্ভিস সামলায়, সরাসরি লেখা অবস্থায় রাখা হয় না। অ্যাপের ডাটা মুছলে শুধু ডিভাইসের কপি মোছে। অ্যাপ ফন্ট Google Fonts থেকে লোড করে।'],
['How it is used','কীভাবে ব্যবহার হয়','Only to run the app: logging you in, showing your profile, saving your favourites and showing your posts. We do not sell your information, share it with advertisers or show ads.','শুধু অ্যাপ চালাতে: লগ ইন, প্রোফাইল দেখানো, ফেভারিট সংরক্ষণ ও আপনার লেখা দেখানো। আমরা আপনার তথ্য বিক্রি করি না, বিজ্ঞাপনদাতাদের সাথে শেয়ার করি না এবং কোনো বিজ্ঞাপন দেখাই না।'],
['Log in with Google or Facebook','Google বা Facebook দিয়ে লগইন','If you choose to log in with Google or Facebook, we receive only your name and email address from them. We never see your Google or Facebook password, and the app never posts anything for you.','Google বা Facebook দিয়ে লগইন করলে আমরা তাদের কাছ থেকে শুধু আপনার নাম ও ইমেইল পাই। আপনার Google বা Facebook এর পাসওয়ার্ড আমরা কখনো দেখি না, আর অ্যাপ আপনার হয়ে কিছু পোস্ট করে না।'],
['Deleting your data','তথ্য মুছে ফেলা','To delete your account and the content you wrote, contact us using the email address below and we will remove it.','আপনার অ্যাকাউন্ট ও আপনার লেখা মুছতে নিচের ইমেইলে যোগাযোগ করুন, আমরা মুছে দেব।'],
['Permissions','অনুমতি','The app only opens your photo or audio files when you choose to pick one. It does not use your location, contacts or microphone.','আপনি নিজে বেছে নিলেই অ্যাপ আপনার ছবি বা অডিও ফাইল খোলে। এটি আপনার লোকেশন, কন্টাক্ট বা মাইক্রোফোন ব্যবহার করে না।'],
['Your choices','আপনার নিয়ন্ত্রণ','You can change your name, email, phone, photo and password in Profile → Edit profile, and delete your own posts and comments. To remove everything, clear the app data or uninstall the app.','Profile → Edit profile থেকে নাম, ইমেইল, ফোন, ছবি ও পাসওয়ার্ড বদলাতে এবং নিজের লেখা ও মন্তব্য মুছতে পারবেন। সবকিছু মুছতে অ্যাপের ডাটা ক্লিয়ার করুন বা আনইনস্টল করুন।'],
['Children','শিশু','If you are under 13, please ask a parent or guardian before creating an account.','আপনার বয়স ১৩ বছরের কম হলে অ্যাকাউন্ট খোলার আগে অভিভাবকের অনুমতি নিন।'],
['Changes','পরিবর্তন','If we later add online sync or cloud accounts, we will update this policy before any data leaves your device.','ভবিষ্যতে অনলাইন সিঙ্ক বা ক্লাউড অ্যাকাউন্ট যোগ করলে ডিভাইসের বাইরে কোনো তথ্য যাওয়ার আগেই এই নীতি আপডেট করা হবে।']];
const privHtml=()=>{const bn=CFG.lang==='bn',P=CONTACT_EMAIL?[...PRIV,['Contact','যোগাযোগ',CONTACT_EMAIL,CONTACT_EMAIL]]:PRIV;return `<div class="card legal">${P.map(x=>`<h3>${esc(x[bn?1:0])}</h3><p>${esc(x[bn?3:2])}</p>`).join('')}</div>`};
const val=id=>($('#'+id)?.value||'').trim();
// ---- Translations: key:[English, বাংলা] ----
const TX={
welcome:['Welcome to Marma Language','মারমা ভাষায় স্বাগতম'],signin:['Log in','লগ ইন'],signup:['Sign up','সাইন আপ'],back:['Back','পেছনে'],
name:['Your name','আপনার নাম'],email:['Email','ইমেইল'],pass:['Password (min 8 characters)','পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)'],create:['Create account','অ্যাকাউন্ট খুলুন'],
newq:['New? Sign up','নতুন? Sign up'],have:['Already have an account? Log in','অ্যাকাউন্ট আছে? Log in'],
e_fill:['Enter your name, an email or phone number, and a password of 8+ characters.','নাম, ইমেইল বা ফোন নম্বর ও ৮+ অক্ষরের পাসওয়ার্ড দিন।'],e_exist:['An account with this email or phone already exists.','এই ইমেইল বা ফোন নম্বরে অ্যাকাউন্ট আছে।'],e_wrong:['Wrong email/phone or password.','ইমেইল/ফোন বা পাসওয়ার্ড ভুল।'],
search:['Search Marma, Bangla, English…','খুঁজুন: Marma, বাংলা, English…'],

// ---- Audio (IndexedDB) ----
const idb=new Promise(r=>{try{const q=indexedDB.open('ml_audio',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
let audioFetch=null,audioHook=null,audioDel=null,cloudHook=null;
const aputLocal=async(k,b)=>{const d=await idb;if(!d)return false;return new Promise(r=>{const x=d.transaction('a','readwrite');x.objectStore('a').put(b,k);x.oncomplete=()=>r(true);x.onerror=()=>r(false)})};
const aput=async(k,b)=>{const ok=await aputLocal(k,b);if(ok&&audioHook)audioHook(k);return ok};
const agetLocal=async k=>{const d=await idb;if(!d)return null;return new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})};
const aget=async k=>{let b=await agetLocal(k);if(b||!audioFetch)return b;b=await audioFetch(k);if(b)aputLocal(k,b);return b};
const adel=async k=>{if(!k)return;const d=await idb;if(d)d.transaction('a','readwrite').objectStore('a').delete(k);if(audioDel)audioDel(k)};
let cur;async function play(k){const b=await aget(k);if(!b){alert(t('noAudio'));return}if(cur)cur.pause();cur=new Audio(URL.createObjectURL(b));cur.play().catch(()=>{})}

function flat(){const m={},add=(col,id,data)=>{m[col+'|'+id]={col,id:String(id),data}};

 DB.lit.posts.forEach(p=>{const {cm,rx,...rest}=p;add('posts',p.id,rest);
  (cm||[]).forEach(c=>add('comments',c.id,{...c,post:p.id}));
  Object.entries(rx||{}).forEach(([e,L])=>(L||[]).forEach(u=>add('reactions',p.id+'|'+e+'|'+u,{post:p.id,e,by:u})))});

 return m}
const PRI={cats:0,dict:1,words:1,sentences:1,tables:2,posts:3,comments:4,reactions:5,ratings:6};

 if(col==='dict'||col==='words'||col==='sentences'){DB[col]=DB[col]||[];put(DB[col],true)}
 else if(col==='tables')put(DB.tables,false);
 else if(col==='cats')put(DB.lit.cats,false);
 else if(col==='ratings'){const i=DB.ratings.findIndex(r=>same(r.by,id));if(deleted){if(i>=0)DB.ratings.splice(i,1)}else if(i>=0)DB.ratings[i]=d;else DB.ratings.push(d)}

 else if(col==='comments'){const p=d.post!==undefined?DB.lit.posts.find(q=>same(q.id,d.post)):DB.lit.posts.find(q=>(q.cm||[]).some(c=>same(c.id,id)));if(!p)return;p.cm=p.cm||[];const i=p.cm.findIndex(c=>same(c.id,id));if(deleted){if(i>=0)p.cm.splice(i,1)}else if(i>=0)p.cm[i]=d;else p.cm.push(d)}
 else if(col==='reactions'){const p=DB.lit.posts.find(q=>same(q.id,d.post));if(!p)return;p.rx=p.rx||{};const L=p.rx[d.e]||[];if(deleted)p.rx[d.e]=L.filter(u=>!same(u,d.by));else if(!L.some(u=>same(u,d.by)))p.rx[d.e]=[...L,d.by]}}

function applyItems(items,force){

function syncT(){const x=S.tid&&curT();if(!x||!$('#t_cap'))return;x.cap=val('t_cap');x.cols=x.cols.map((_,i)=>val('h'+i));x.rows.forEach((r,ri)=>r.c.forEach((y,ci)=>y.t=val(`c${ri}_${ci}`)))}
function pic(file){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);user().pic=c.toDataURL('image/jpeg',.8);store.set('ml_users',USERS);SYNC.pdirty=true;saveSync();pushProfile();render()};im.src=URL.createObjectURL(file)}

document.addEventListener('click',async e=>{

 else if(a==='fpsend'){const resend=!!d.resend,idv=resend?(S.fp?.to||''):val('a_id'),I=parseId(idv);S.err='';
  if(resend&&S.fp&&Date.now()-S.fp.at<30000){S.err='e_wait';S.f={id:idv};render();return}

 else if(a==='fpreset'){const P=S.fp,otp=val('a_otp').replace(/\s/g,''),n=val('a_pass'),k=val('a_pass2');S.err='';S.f={otp};

  if(n!==k){S.err='e_mis';render();return}
  b.disabled=true;
  try{const j=await sb('/auth/v1/verify',{method:'POST',body:{type:'recovery',email:P.to,token:otp}});
   await sb('/auth/v1/user',{method:'PUT',tok:j.access_token,body:{password:n}});
   S.fp=null;S.f=null;S.view='signin';S.err='';render();alert(t('pwReset'))}
  catch(e){S.err=e.net?'e_net':(e.code==='same_password'?'e_same':(e.status===422&&e.code==='weak_password'?'e_len':((e.status>=400&&e.status<500)?'e_otp':'e_srv')));render()}}
 else if(a==='syncnow'){sync()}
 else if(a==='oauth'){oauthStart(d.p)}

 else if(a==='tab'){Object.assign(S,{tab:d.t,sub:'',q:'',pf:null});render()}

 else if(a==='dir'){S.dir=d.d;body()}

 else if(a==='star'){S.rtxt=val('r_txt');S.rs=+d.n;body()}
 else if(a==='rate'){const s=S.rs||DB.ratings.find(r=>r.by===ME)?.s;if(!s)return;const r={by:ME,an:user().name,s,x:val('r_txt'),ts:Date.now()},i=DB.ratings.findIndex(x=>x.by===ME);i<0?DB.ratings.push(r):DB.ratings[i]=r;S.rs=0;S.rtxt='';save();body();alert(t('thanks'))}
 else if(a==='theme'){CFG.theme=d.t;store.set('ml_cfg',CFG);applyCfg();body()}
 else if(a==='size'){CFG.size=+d.n;store.set('ml_cfg',CFG);applyCfg();body()}
 else if(a==='saveprofile'){const u=user(),n=val('p_name'),em=val('p_email').toLowerCase(),ph=normPhone(val('p_phone'));
  if(!n){alert(t('e_name'));return}

  if(!em&&!ph){alert(t('e_need'));return}
  u.name=n;u.email=em;u.phone=ph;store.set('ml_users',USERS);
  DB.lit.posts.forEach(p=>{if(p.by===ME)p.an=n;(p.cm||[]).forEach(m=>{if(m.by===ME)m.an=n})});DB.ratings.forEach(r=>{if(r.by===ME)r.an=n});save();
  SYNC.pdirty=true;saveSync();pushProfile();
  S.sub='profile';render();alert(t('saved'))}
 else if(a==='savepw'){const c=val('pw_cur'),n=val('pw_new'),k=val('pw_con');
  if(n.length<8){alert(t('e_len'));return}
  if(n!==k){alert(t('e_mis'));return}
  if(!AUTH||!AUTH.login){alert(t('syncAuth'));return}
  b.disabled=true;
  try{const j=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email:AUTH.login,password:c}});setAuth(j);
   await sb('/auth/v1/user',{method:'PUT',tok:j.access_token,body:{password:n}});b.disabled=false;body();alert(t('pwDone'))}
  catch(e){b.disabled=false;alert(t(e.net?'e_net':(e.code==='same_password'?'e_same':(e.code==='weak_password'?'e_len':(e.status===400||e.status===401||e.code==='invalid_credentials'?'e_cur':'e_srv')))))}}
 else if(a==='picpick')$('#pfile').click();
 else if(a==='picrm'){delete user().pic;store.set('ml_users',USERS);SYNC.pdirty=true;saveSync();pushProfile();render()}
 // Literature
 else if(a==='lcat'){S.lcat=d.c;body()}
 else if(a==='newpost'){S.pf='new';body()}
 else if(a==='editpost'){const p=DB.lit.posts.find(x=>x.id===d.id);if(p&&canEdit(p)){S.pf=d.id;body();scrollTo(0,0)}}
 else if(a==='cancelpost'){S.pf=null;body()}
 else if(a==='savepost'){const p={cat:val('l_cat'),title:val('l_title'),lang:val('l_lang'),body:$('#l_body').value.trim()};if(!p.title||!p.body){alert(t('fillTB'));return}

  S.pf=null;save();body()}
 else if(a==='delpost'){const p=DB.lit.posts.find(x=>x.id===d.id);if(p&&canEdit(p)&&confirm(t('sure'))){DB.lit.posts=DB.lit.posts.filter(x=>x!==p);save();body()}}

 else if(a==='cm'){S.open=S.open===d.id?null:d.id;body()}
 else if(a==='addcm'){const x=val('cm_'+d.id);if(!x)return;const p=DB.lit.posts.find(q=>q.id===d.id);(p.cm=p.cm||[]).push({id:uid(),by:ME,an:user().name,text:x,ts:Date.now()});save();body()}

 else if(a==='canceledit'){S.edit=null;body()}
