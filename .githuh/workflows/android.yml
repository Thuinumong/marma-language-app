name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-*.png apple-touch-icon.png www/
          npx esbuild native-entry.js --bundle --minify --format=iife --outfile=www/native.js

      - name: Create Android project
        run: |
          npx cap add android
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.marma.language" android:host="login" />
          </intent-filter>
          '''
          assert '</activity>' in s
          s=s.replace('</activity>',f+'</activity>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Apply Marma app icon
        run: |
          set -e
          test -d android-res || { echo "ERROR: android-res folder repo-te nai"; exit 1; }
          RES=android/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher*.png $RES/mipmap-anydpi-v26/ic_launcher*.xml
          rm -f $RES/drawable/ic_launcher_background.xml $RES/drawable-v24/ic_launcher_foreground.xml
          cp -r android-res/* $RES/
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$n.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          echo "=== Icon applied ==="
          ls -la $RES/mipmap-xxxhdpi $RES/mipmap-anydpi-v26
          cat $RES/values/ic_launcher_background.xml
          grep -n "icon" android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK with permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marma-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/marma-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out marma-language.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs marma-language.apk
          rm -f "$RUNNER_TEMP/marma-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marma-language-apk
          path: marma-language.apk
